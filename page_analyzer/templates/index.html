{% extends 'layout.html' %}

{% block content %}
<div class="p-5 mb-4 bg-light border rounded-3 text-center">
    <h1 class="display-4">Анализатор страниц</h1>
    <p class="lead">Бесплатно проверяйте сайты на SEO-пригодность</p>

    <form action="/urls" method="post" class="row justify-content-center mt-4">
        <div class="col-auto">
            <label for="url" class="visually-hidden">Ссылка для анализа</label>
            <input type="text" name="url" id="url" class="form-control form-control-lg"
                   placeholder="https://www.example.com" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary btn-lg">Проверить</button>
        </div>
    </form>
</div>
{% endblock %}
